name: icarus-deploy

on:
  workflow_dispatch:
    inputs:
      reconcile_container:
        description: "Recreate the Icarus container from docker/docker-compose.yml"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: icarus-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, unraid, lan, icarus-prod]
    environment: production-icarus
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SLURPNET_LAUNCHER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      SERVER_NAME: "SlurpNet Icarus"
      MAX_PLAYERS: "8"
      ICARUS_RECONCILE_CONTAINER: ${{ inputs.reconcile_container == 'true' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # pak/SlurpNet.pak is intentionally gitignored because it is a
          # generated mod-manager output. Preserve an operator-staged pak in
          # the persistent runner workspace instead of deleting ignored files.
          clean: false

      - name: Hydrate staged pak from live appdata when documented
        run: |
          set -euo pipefail
          expected_sha="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("Mods/MODS.md").read_text(encoding="utf-8")
          match = re.search(r"SHA256: `([0-9a-f]{64})`", text)
          if not match:
              raise SystemExit("Mods/MODS.md is missing the documented SlurpNet.pak SHA256")
          print(match.group(1))
          PY
          )"
          live_pak="${ICARUS_APPDATA:-/mnt/cache/appdata/icarus}/Icarus/Content/Paks/mods/SlurpNet.pak"
          if [ ! -f "$live_pak" ]; then
            echo "No live pak found at $live_pak; keeping workspace pak."
            exit 0
          fi
          live_sha="$(sha256sum "$live_pak" | awk '{print $1}')"
          if [ "$live_sha" != "$expected_sha" ]; then
            echo "Live pak SHA $live_sha does not match documented SHA $expected_sha; keeping workspace pak."
            exit 0
          fi
          workspace_sha=""
          if [ -f pak/SlurpNet.pak ]; then
            workspace_sha="$(sha256sum pak/SlurpNet.pak | awk '{print $1}')"
          fi
          if [ "$workspace_sha" != "$expected_sha" ]; then
            mkdir -p pak
            cp "$live_pak" pak/SlurpNet.pak
            echo "Hydrated pak/SlurpNet.pak from live appdata SHA $expected_sha."
          else
            echo "Workspace pak already matches documented SHA $expected_sha."
          fi

      - name: Validate release
        run: scripts/validate-icarus-release.sh

      - name: Validate self-hosted runner readiness
        run: bash scripts/validate-unraid-runner-ready.sh

      - name: Render production ServerSettings.ini
        run: |
          cat > .env.production <<EOF
          SERVER_NAME="${SERVER_NAME}"
          SERVER_PASSWORD=${SERVER_PASSWORD}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          MAX_PLAYERS=${MAX_PLAYERS}
          EOF
          scripts/render-server-settings.sh .env.production config/ServerSettings.ini

      - name: Deploy server config and pak
        run: bash scripts/deploy.sh "$GITHUB_WORKSPACE"

      - name: Build client pack and update launcher feeds
        run: python3 scripts/build-client-pack.py

      - name: Trigger launcher feed re-sign
        if: success()
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          gh api -X POST /repos/zachyzissou/slurpnet-launcher/dispatches \
            -f event_type=feed-updated \
            -f "client_payload[source]=${{ github.repository }}"
